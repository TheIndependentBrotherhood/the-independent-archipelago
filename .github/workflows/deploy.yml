name: Deploy site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy to GitHub Pages (retry once on failure)
        id: deploy_retry
        if: ${{ steps.deploy.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Fail when both deploy attempts fail
        if: ${{ steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome != 'success' }}
        run: |
          echo "Both deploy attempts failed." >&2
          exit 1
